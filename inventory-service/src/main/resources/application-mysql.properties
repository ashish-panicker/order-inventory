# --- Database Connection Properties ---
# JDBC URL for the Inventory Database
spring.datasource.url=jdbc:mysql://localhost:3307/inventory_db
# Database Username
spring.datasource.username=dbuser
# Database Password
spring.datasource.password=dbpassword
# JDBC Driver class name
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- Hibernate Properties ---
# Generate SQL schema automatically (update schema if necessary)
spring.jpa.hibernate.ddl-auto=none
# The SQL dialect makes Hibernate generate better SQL for the chosen database
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Show generated SQL in logs
spring.jpa.show-sql=true
# Format the generated SQL to make it more readable
spring.jpa.properties.hibernate.format_sql=true
