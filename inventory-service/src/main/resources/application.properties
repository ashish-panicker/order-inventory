# Application Name
spring.application.name=inventory-service
spring.profiles.active=mysql

# --- Logging Configuration ---
# Set the root logging level
logging.level.root=INFO
# Log SQL statements parameters binding (Hibernate 6+ / Spring Boot 3+)
logging.level.org.hibernate.orm.jdbc.bind=TRACE
# Log SQL statements parameters binding (Hibernate 5 / Spring Boot 2.x) - fallback
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# --- Logging Formats ---
# Console log format (standard/compact)
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
# File log format (more detailed: includes thread name, log level, and logger name)
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# --- Log File Location ---
# Specify the log file name
logging.file.name=logs/inventory-service.log

# --- Server Configuration ---
# Set distinct port for inventory-service
server.port=8082

# --- Additional Server Settings ---
# Global API context path
server.servlet.context-path=/api/v1
# Enable graceful shutdown
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
