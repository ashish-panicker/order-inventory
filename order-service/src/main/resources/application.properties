# Application Name
spring.application.name=order-service

# --- Database Connection Properties ---
# JDBC URL for the Order Database
spring.datasource.url=jdbc:mysql://localhost:3306/order_db
# Database Username
spring.datasource.username=dbuser
# Database Password
spring.datasource.password=dbpassword
# JDBC Driver class name
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- Hibernate Properties ---
# Generate SQL schema automatically (update schema if necessary)
spring.jpa.hibernate.ddl-auto=update
# The SQL dialect makes Hibernate generate better SQL for the chosen database
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Show generated SQL in logs
spring.jpa.show-sql=true
# Format the generated SQL to make it more readable
spring.jpa.properties.hibernate.format_sql=true

# --- Logging Configuration ---
# Set the root logging level
logging.level.root=INFO
# Log SQL statements parameters binding (Hibernate 6+ / Spring Boot 3+)
logging.level.org.hibernate.orm.jdbc.bind=TRACE
# Log SQL statements parameters binding (Hibernate 5 / Spring Boot 2.x) - fallback
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# --- Logging Formats ---
# Console log format (standard/compact)
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
# File log format (more detailed: includes thread name, log level, and logger name)
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# --- Log File Location ---
# Specify the log file name
logging.file.name=logs/order-service.log

# --- Server Configuration ---
# Set distinct port for order-service
server.port=8081

# --- Additional Server Settings ---
# Global API context path
server.servlet.context-path=/api/v1
# Enable graceful shutdown
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
