version: '3.8'

services:
  order_db:
    image: mysql:8.0
    container_name: order_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: order_db
      MYSQL_USER: dbuser
      MYSQL_PASSWORD: dbpassword
    ports:
      - "3306:3306"
    volumes:
      - ./data/order_db_data:/var/lib/mysql:z
      - ./order-service/schema.sql:/docker-entrypoint-initdb.d/schema.sql:z
    restart: unless-stopped

  inventory_db:
    image: mysql:8.0
    container_name: inventory_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: inventory_db
      MYSQL_USER: dbuser
      MYSQL_PASSWORD: dbpassword
    ports:
      - "3307:3306"
    volumes:
      - ./data/inventory_db_data:/var/lib/mysql:z
      - ./inventory-service/schema.sql:/docker-entrypoint-initdb.d/schema.sql:z
    restart: unless-stopped
